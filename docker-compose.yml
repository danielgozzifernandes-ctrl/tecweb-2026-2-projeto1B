services:
  db:
    image: postgres:16
    container_name: getit-db
    environment:
      POSTGRES_DB: getit
      POSTGRES_USER: getituser
      POSTGRES_PASSWORD: getitsenha
    ports:
      - "5432:5432"
    volumes:
      - getit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getituser -d getit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  getit_pgdata:
