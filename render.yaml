databases:
  - name: getit-db
    databaseName: getit
    user: getituser
    plan: free

services:
  - type: web
    name: getit
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn getit.wsgi"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: getit-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.6"
