{% extends "notes/base.html" %}

{% block content %}
<main class="container">
  <form class="form-card" method="post">
    {% csrf_token %}
    {% if erro %}
    <p class="form-error">{{ erro }}</p>
    {% endif %}
    <input
      class="form-card-title"
      type="text"
      name="titulo"
      placeholder="Título"
      value="{{ titulo }}"
    />
    <textarea
      class="autoresize"
      name="detalhes"
      placeholder="Digite o conteúdo..."
    >{{ detalhes }}</textarea>
    <button class="btn" type="submit">Criar</button>
  </form>

  <div class="card-container">
    {% for note in notes %}
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">{{ note.title }}</h3>
        <div class="card-actions">
          <a class="card-action" href="{% url 'edit' note.id %}" title="Editar">&#9998;</a>
          <a class="card-action" href="{% url 'delete' note.id %}" title="Apagar">&#128465;</a>
        </div>
      </div>
      <div class="card-content">
        <p>{{ note.content }}</p>
      </div>
    </div>
    {% empty %}
    <p>Nenhuma anotação por enquanto.</p>
    {% endfor %}
  </div>
</main>
{% endblock %}
