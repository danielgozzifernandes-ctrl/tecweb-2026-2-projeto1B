{% extends "notes/base.html" %}

{% block content %}
<main class="container">
  <h2 class="list-title">Anotações com a tag "{{ tag.nome }}"</h2>

  <div class="card-container">
    {% for note in notes %}
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">{{ note.title }}</h3>
      </div>
      <div class="card-content">
        <p>{{ note.content }}</p>
      </div>
    </div>
    {% empty %}
    <p>Nenhuma anotação com esta tag.</p>
    {% endfor %}
  </div>

  <a class="btn-link" href="{% url 'tags_list' %}">Voltar para as tags</a>
</main>
{% endblock %}
